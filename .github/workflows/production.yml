name: Lely Cake CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: daffaazhar/lely-cake

jobs:
  ci:
    name: Validate application
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run type checking
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build Next.js
        run: npm run build

  publish:
    name: Build and publish image
    needs:
      - ci

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs:
      - publish

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    concurrency:
      group: lely-cake-production
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          cd /var/www/lely-cake

          echo "Updating deployment configuration..."

          git fetch origin main
          git checkout main
          git reset --hard "$IMAGE_TAG"

          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .deploy.env

          echo "Validating Docker Compose..."

          docker compose \
            --env-file .deploy.env \
            config >/dev/null

          echo "Pulling image ghcr.io/daffaazhar/lely-cake:$IMAGE_TAG..."

          docker compose \
            --env-file .deploy.env \
            pull lely-cake

          echo "Starting application..."

          docker compose \
            --env-file .deploy.env \
            up -d \
            --no-deps \
            --remove-orphans \
            lely-cake

          echo "Waiting for application health check..."

          STATUS="starting"

          for ATTEMPT in $(seq 1 18); do
            STATUS="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                lely_cake 2>/dev/null || true
            )"

            echo "Health status: ${STATUS:-unknown}"

            if [ "$STATUS" = "healthy" ]; then
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Application became unhealthy."
              docker logs --tail=150 lely_cake
              exit 1
            fi

            sleep 5
          done

          if [ "$STATUS" != "healthy" ]; then
            echo "Application did not become healthy."
            docker logs --tail=150 lely_cake
            exit 1
          fi

          echo "Reloading Nginx..."

          docker exec nginx_proxy nginx -t
          docker exec nginx_proxy nginx -s reload

          echo "Cleaning dangling images..."

          docker image prune -f

          echo "Deployment completed."

          docker compose \
            --env-file .deploy.env \
            ps
          REMOTE

      - name: Verify production website
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "$PRODUCTION_URL" \
            >/dev/null

          echo "Production website is reachable."
