services:
  lely-cake:
    image: ghcr.io/daffaazhar/lely-cake:${IMAGE_TAG:-latest}
    container_name: lely_cake
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    # Aktifkan jika aplikasi membutuhkan runtime environment variable.
    # env_file:
    #   - .env.production

    expose:
      - "3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
    name: proxy_net
